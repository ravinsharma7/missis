name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: ticket lifecycle
        run: go run ./tools/check-done

  windows:
    # Ticket #55 C1: real windows/amd64 runner. Exercises the black-box suite
    # end-to-end (binary build with .exe), drive-letter/UNC discovery tests
    # (build-tagged windows), and SQLite concurrency/locking on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: ticket lifecycle
        run: go run ./tools/check-done
