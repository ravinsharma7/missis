name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  MISSIS_STORE_DIAG: ${{ github.workspace }}/temp/diag/cli-diag.jsonl
  MISSIS_DIAG_DIR: ${{ github.workspace }}/temp/diag/testsuite

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Verify canonical product surface
        run: bash scripts/ci/verify.sh linux
      - name: Store diagnostic summary
        if: always()
        shell: bash
        run: |
          DIAG="${MISSIS_STORE_DIAG//\\//}"
          if [ -s "$DIAG" ]; then
            echo "store diagnostics: $DIAG"
            if ! grep -E '"(err_kind|decision)":"(busy|conflict|unique)"' "$DIAG"; then
              echo "no busy/conflict/unique markers in store diagnostics"
            fi
          else
            echo "no store diagnostics captured"
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_id }}-${{ runner.os }}
          path: temp/diag
          if-no-files-found: ignore
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Verify portable product surface
        shell: bash
        run: bash scripts/ci/verify.sh windows
      - name: Verify native Windows pair
        shell: pwsh
        run: .\scripts\ci\verify-windows.ps1
      - name: Store diagnostic summary
        if: always()
        shell: bash
        run: |
          DIAG="${MISSIS_STORE_DIAG//\\//}"
          if [ -s "$DIAG" ]; then
            echo "store diagnostics: $DIAG"
            if ! grep -E '"(err_kind|decision)":"(busy|conflict|unique)"' "$DIAG"; then
              echo "no busy/conflict/unique markers in store diagnostics"
            fi
          else
            echo "no store diagnostics captured"
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_id }}-${{ runner.os }}
          path: temp/diag
          if-no-files-found: ignore
          retention-days: 7
