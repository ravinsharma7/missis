name: ci

on:
  push:
    branches: [main]
  pull_request:

# Always-on store diagnostics (ticket #65): every run captures append-path
# JSON lines and preserves failing stress-test stores, so flaky concurrency
# evidence is visible without re-running anything.
env:
  MISSIS_STORE_DIAG: ${{ github.workspace }}/temp/diag/cli-diag.jsonl
  MISSIS_DIAG_DIR: ${{ github.workspace }}/temp/diag/testsuite

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh testsuite/scripts/*.sh testsuite/benchmarks/*.sh
      - name: test
        run: go test -count=1 ./...
      - name: requirements coverage
        run: go run ./tools/coverage --registry specs/requirements-registry.v3.json
      - name: backup script harness
        run: bash testsuite/scripts/test-rclone-backup.sh
      - name: TUI smoke
        run: go test -count=1 -run '^TestTUISmoke$' -v ./tools/ticket-tui
      - name: store diagnostic summary
        shell: bash
        run: |
          DIAG="${MISSIS_STORE_DIAG//\\//}"
          if [ -s "$DIAG" ]; then
            echo "store diagnostics: $DIAG"
            if grep -E '"(err_kind|decision)":"(busy|conflict|unique)"' "$DIAG"; then
              :
            else
              echo "no busy/conflict/unique markers in store diagnostics"
            fi
          else
            echo "no store diagnostics captured"
          fi
      - name: upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_id }}-${{ runner.os }}
          path: temp/diag
          if-no-files-found: ignore
          retention-days: 7
      - name: ticket lifecycle
        run: go run ./tools/check-done

  windows:
    # Ticket #55 C1: real windows/amd64 runner. Exercises the black-box suite
    # end-to-end (binary build with .exe), drive-letter/UNC discovery tests
    # (build-tagged windows), and SQLite concurrency/locking on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: requirements coverage
        run: go run ./tools/coverage --registry specs/requirements-registry.v3.json
      - name: TUI smoke
        run: go test -count=1 -run '^TestTUISmoke$' -v ./tools/ticket-tui
      - name: store diagnostic summary
        shell: bash
        run: |
          DIAG="${MISSIS_STORE_DIAG//\\//}"
          if [ -s "$DIAG" ]; then
            echo "store diagnostics: $DIAG"
            if grep -E '"(err_kind|decision)":"(busy|conflict|unique)"' "$DIAG"; then
              :
            else
              echo "no busy/conflict/unique markers in store diagnostics"
            fi
          else
            echo "no store diagnostics captured"
          fi
      - name: upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_id }}-${{ runner.os }}
          path: temp/diag
          if-no-files-found: ignore
          retention-days: 7
      - name: ticket lifecycle
        run: go run ./tools/check-done
